                internalError:
                  $ref: '#/components/examples/SYSTEM_INTERNAL_ERROR'
  /exchange-rate/{date}:
    get:
      tags:
        - Exchange Rates
      summary: Get exchange rates for a specific date
      description: |
        Retrieve exchange rates for a specific date in ISO 8601 format (YYYY-MM-DD). Returns empty array if no rates found for the date.
      operationId: getExchangeRate
      parameters:
        - name: date
          in: path
          required: true
          description: Date in ISO 8601 format (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: '2024-01-15'
      responses:
        '200':
          description: Exchange rates retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRateResponse'
        '400':
          description: Validation error - Invalid date format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Invalid or missing Firebase JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /groups:
    post:
      tags:
        - Groups
      summary: Create a new group
      description: |
        Creates a new group. The creator is automatically registered as an authenticated member.
        All other participants are registered as unjoined members (no auth account linked).

        **Business Rules:**
        1. **Creator as authenticated member**: The creator is linked to their auth account on creation (R1-AC2; see `design.md` → Canonical Testable Flows → POST /groups フロー).
        2. **Participants as unjoined members**: Participants are registered with name only; they join later via invite token (R1-AC3).
        3. **Group count limit**: A user may not belong to more than 9 groups; privilege users are exempt (R3-AC1, R3-AC2; see `design.md` → Assertion Rules For Test Authors).

        **Dependencies**: MySQL (`groups`, `users`, `user_groups` tables).
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
            examples:
              createGroup:
                summary: Create a group with two participants
                value:
                  group_name: Summer Trip 2024
                  host_name: Alice
                  participants_name:
                    - Bob
                    - Charlie
      responses:
        '201':
          description: Group created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '400':
          description: |
            Bad request — input validation failed.

            | Internal code | Message |
            |---------------|---------|
            | `VALIDATION.FAILED` | 入力内容に誤りがあります |
            | `REQUEST.MALFORMED_JSON` | リクエストの形式が正しくありません |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationFailed:
                  $ref: '#/components/examples/VALIDATION_FAILED'
                malformedJson:
                  $ref: '#/components/examples/REQUEST_MALFORMED_JSON'
        '401':
          description: |
            Unauthorized — invalid or missing authentication token.

            | Internal code | Message |
            |---------------|---------|
            | `AUTH.MISSING_CREDENTIALS` | 認証情報が必要です |
            | `AUTH.INVALID_FORMAT` | 認証情報の形式が正しくありません |
            | `AUTH.INVALID_TOKEN` | 認証トークンが無効です |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingCredentials:
                  $ref: '#/components/examples/AUTH_MISSING_CREDENTIALS'
                invalidFormat:
                  $ref: '#/components/examples/AUTH_INVALID_FORMAT'
                invalidToken:
                  $ref: '#/components/examples/AUTH_INVALID_TOKEN'
        '404':
          description: |
            Not found — the auth user record does not exist.

            | Internal code | Message |
            |---------------|---------|
            | `AUTH_USER.NOT_FOUND` | 認証ユーザーが見つかりません |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                authUserNotFound:
                  $ref: '#/components/examples/AUTH_USER_NOT_FOUND'
        '409':
          description: |
            Conflict — user has reached the maximum number of groups.

            | Internal code | Message |
            |---------------|---------|
            | `USER.MAX_GROUP_COUNT_EXCEEDED` | 参加できるグループは10個までです |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                maxGroupCountExceeded:
                  $ref: '#/components/examples/USER_MAX_GROUP_COUNT_EXCEEDED'
        '415':
          description: |
            Unsupported Media Type — Content-Type must be application/json.

            | Internal code | Message |
            |---------------|---------|
            | `REQUEST.UNSUPPORTED_MEDIA_TYPE` | サポートされていないContent-Typeです |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unsupportedMediaType:
                  $ref: '#/components/examples/REQUEST_UNSUPPORTED_MEDIA_TYPE'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  $ref: '#/components/examples/SYSTEM_INTERNAL_ERROR'
  /groups/list:
    get:
      tags:
        - Groups
      summary: Get list of groups for the current user
      description: |
        Returns the list of groups the authenticated user currently belongs to as an authenticated member.
        Groups the user has left (auth link unlinked) are not included.
        Returns an empty list if the user belongs to no groups.

        **Business Rules:**
        1. **Joined groups only**: Only groups where the user is an authenticated member are returned; left groups are excluded (R8-AC2, R8-AC3; see `design.md` → Canonical Testable Flows → GET /groups/list フロー).
      operationId: getGroupList
      responses:
        '200':
          description: Group list retrieved successfully (empty list if no groups)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListResponse'
        '401':
          description: |
            Unauthorized — invalid or missing authentication token.

            | Internal code | Message |
            |---------------|---------|
            | `AUTH.MISSING_CREDENTIALS` | 認証情報が必要です |
            | `AUTH.INVALID_FORMAT` | 認証情報の形式が正しくありません |
            | `AUTH.INVALID_TOKEN` | 認証トークンが無効です |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingCredentials:
                  $ref: '#/components/examples/AUTH_MISSING_CREDENTIALS'
                invalidFormat:
                  $ref: '#/components/examples/AUTH_INVALID_FORMAT'
                invalidToken:
                  $ref: '#/components/examples/AUTH_INVALID_TOKEN'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  $ref: '#/components/examples/SYSTEM_INTERNAL_ERROR'
  /groups/{groupId}:
    get:
      tags:
        - Groups
      summary: Get group information by ID
      description: |
        Retrieves detailed group information including all members and transaction count.
        Any authenticated user may retrieve group details regardless of membership.

        **Business Rules:**
        1. **No access control**: Authentication is required but group membership is not (R5-AC1; see `design.md` → Step 2 Scope and Ownership Rules).
      operationId: getGroupInfo
      parameters:
        - $ref: '#/components/parameters/groupIdPath'
      responses:
        '200':
          description: Group information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '400':
          description: |
            Bad request — invalid UUID format for groupId.

            | Internal code | Message |
            |---------------|---------|
            | `VALIDATION.FAILED` | 入力内容に誤りがあります |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationFailed:
                  $ref: '#/components/examples/VALIDATION_FAILED'
        '401':
          description: |
            Unauthorized — invalid or missing authentication token.

            | Internal code | Message |
            |---------------|---------|
            | `AUTH.MISSING_CREDENTIALS` | 認証情報が必要です |
            | `AUTH.INVALID_FORMAT` | 認証情報の形式が正しくありません |
            | `AUTH.INVALID_TOKEN` | 認証トークンが無効です |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingCredentials:
                  $ref: '#/components/examples/AUTH_MISSING_CREDENTIALS'
                invalidFormat:
                  $ref: '#/components/examples/AUTH_INVALID_FORMAT'
                invalidToken:
                  $ref: '#/components/examples/AUTH_INVALID_TOKEN'
        '404':
          description: |
            Not found — group does not exist or has no members.

            | Internal code | Message |
            |---------------|---------|
            | `GROUP.NOT_FOUND` | グループが見つかりません |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                groupNotFound:
                  $ref: '#/components/examples/GROUP_NOT_FOUND'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  $ref: '#/components/examples/SYSTEM_INTERNAL_ERROR'
    patch:
      tags:
        - Groups
      summary: Update group name
      description: |
        Updates the name of the specified group. Any authenticated user may update the group name
        regardless of membership.

        **Business Rules:**
        1. **No authorization check**: Authentication is required but group membership is not (R9-AC1; see `design.md` → Step 2 Scope and Ownership Rules).
        2. **Immutable attributes**: Only the group name is updated; join_token, created_at, and other attributes remain unchanged (R9-AC3, R9-AC4).
      operationId: updateGroupName
      parameters:
        - $ref: '#/components/parameters/groupIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupNameRequest'
            examples:
              updateName:
                summary: Update group name
                value:
                  group_name: Winter Trip 2024
      responses:
