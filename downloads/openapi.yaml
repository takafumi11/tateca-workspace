openapi: 3.1.0
info:
  title: Tateca API
  description: |
    Group expense management API with multi-currency support. Track expenses, loans, and settlements across multiple users and currencies.

    **Localization**: Clients may send an `Accept-Language` header (`ja` or `en`) to select the language of error response `message` fields. When omitted or set to an unsupported language, the API defaults to Japanese (`ja`). The `error_code` field is always a stable, language-independent identifier.
  version: 1.0.0
  contact:
    name: Tateca Team
    url: https://tateca.net
    email: support@tateca.net
  license:
    name: Proprietary
    url: https://tateca.net/terms
servers:
  - url: http://localhost:8080
    description: Local Development
  - url: https://staging-api.tateca.net
    description: Staging
  - url: https://api.tateca.net
    description: Production
security:
  - BearerAuth: []
paths:
  /auth/users:
    post:
      tags:
        - Auth Users
      summary: Create new authenticated user
      description: |
        Registers a new authenticated user in the system upon first login.

        **Business Rules:**
        1. **Email uniqueness**: The email address must not be already registered to another user (R3-AC1; see `design.md` → Canonical Testable Flows → Request Flow).
        2. **Initial values**: login count is set to 1, app review status is set to PENDING, and last login time is set to the creation timestamp (R1-AC2, R1-AC3; see `design.md` → Assertion Rules For Test Authors).
      operationId: createAuthUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuthUserRequest'
            examples:
              createUser:
                summary: Create auth user
                value:
                  email: john@example.com
      responses:
        '201':
          description: Auth user created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '400':
          description: |
            Bad request.

            | Internal code | Message |
            |---------------|---------|
            | `VALIDATION.FAILED` | 入力内容に誤りがあります |
            | `REQUEST.MALFORMED_JSON` | リクエストの形式が正しくありません |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationFailed:
                  $ref: '#/components/examples/VALIDATION_FAILED'
                malformedJson:
                  $ref: '#/components/examples/REQUEST_MALFORMED_JSON'
        '401':
          description: |
            Unauthorized — invalid or missing authentication token.

            | Internal code | Message |
            |---------------|---------|
            | `AUTH.MISSING_CREDENTIALS` | 認証情報が必要です |
            | `AUTH.INVALID_FORMAT` | 認証情報の形式が正しくありません |
            | `AUTH.INVALID_TOKEN` | 認証トークンが無効です |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingCredentials:
                  $ref: '#/components/examples/AUTH_MISSING_CREDENTIALS'
                invalidFormat:
                  $ref: '#/components/examples/AUTH_INVALID_FORMAT'
                invalidToken:
                  $ref: '#/components/examples/AUTH_INVALID_TOKEN'
        '409':
          description: |
            Conflict — email address already registered.

            | Internal code | Message |
            |---------------|---------|
            | `AUTH_USER.EMAIL_DUPLICATE` | このメールアドレスは既に登録されています |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emailDuplicate:
                  $ref: '#/components/examples/AUTH_USER_EMAIL_DUPLICATE'
        '415':
          description: |
            Unsupported Media Type — Content-Type must be application/json.

            | Internal code | Message |
            |---------------|---------|
            | `REQUEST.UNSUPPORTED_MEDIA_TYPE` | サポートされていないContent-Typeです |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unsupportedMediaType:
                  $ref: '#/components/examples/REQUEST_UNSUPPORTED_MEDIA_TYPE'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  $ref: '#/components/examples/SYSTEM_INTERNAL_ERROR'
  /auth/users/{uid}:
    get:
      tags:
        - Auth Users
      summary: Get authenticated user information
      description: |
        Retrieves detailed information about an authenticated user by their UID.
        Login count is incremented and last login time is updated on every call.

        **Business Rules:**
        1. **Login record update**: Each call increments `total_login_count` by 1 and updates `last_login_time` to the current timestamp (R4-AC2; see `design.md` → Canonical Testable Flows → GET フロー).
      operationId: getAuthUser
      parameters:
        - $ref: '#/components/parameters/uidPath'
      responses:
        '200':
          description: Auth user information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '400':
          description: |
            Bad request — invalid UID path parameter.

            | Internal code | Message |
            |---------------|---------|
            | `VALIDATION.FAILED` | 入力内容に誤りがあります |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationFailed:
                  $ref: '#/components/examples/VALIDATION_FAILED'
        '401':
          description: |
            Unauthorized — invalid or missing authentication token.

            | Internal code | Message |
            |---------------|---------|
            | `AUTH.MISSING_CREDENTIALS` | 認証情報が必要です |
            | `AUTH.INVALID_FORMAT` | 認証情報の形式が正しくありません |
            | `AUTH.INVALID_TOKEN` | 認証トークンが無効です |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingCredentials:
                  $ref: '#/components/examples/AUTH_MISSING_CREDENTIALS'
                invalidFormat:
                  $ref: '#/components/examples/AUTH_INVALID_FORMAT'
                invalidToken:
                  $ref: '#/components/examples/AUTH_INVALID_TOKEN'
        '404':
          description: |
            Auth user not found.

            | Internal code | Message |
            |---------------|---------|
            | `AUTH_USER.NOT_FOUND` | 認証ユーザーが見つかりません |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                authUserNotFound:
                  $ref: '#/components/examples/AUTH_USER_NOT_FOUND'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  $ref: '#/components/examples/SYSTEM_INTERNAL_ERROR'
    delete:
      tags:
        - Auth Users
      summary: Delete authenticated user
      description: |
        Removes an authenticated user from the system.
        All linked app-user records have their auth reference unlinked before deletion; the app-user records themselves are preserved.

        **Business Rules:**
        1. **Unlink before delete**: All app-user records linked to the auth user have `auth_user_uid` set to NULL before the auth user record is deleted (R6-AC2, R6-AC3; see `design.md` → Canonical Testable Flows → DELETE フロー).
      operationId: deleteAuthUser
      parameters:
        - $ref: '#/components/parameters/uidPath'
      responses:
        '204':
          description: Auth user deleted successfully
        '400':
          description: |
            Bad request — invalid UID path parameter.

            | Internal code | Message |
            |---------------|---------|
            | `VALIDATION.FAILED` | 入力内容に誤りがあります |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationFailed:
                  $ref: '#/components/examples/VALIDATION_FAILED'
        '401':
          description: |
            Unauthorized — invalid or missing authentication token.

            | Internal code | Message |
            |---------------|---------|
            | `AUTH.MISSING_CREDENTIALS` | 認証情報が必要です |
            | `AUTH.INVALID_FORMAT` | 認証情報の形式が正しくありません |
            | `AUTH.INVALID_TOKEN` | 認証トークンが無効です |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingCredentials:
                  $ref: '#/components/examples/AUTH_MISSING_CREDENTIALS'
                invalidFormat:
                  $ref: '#/components/examples/AUTH_INVALID_FORMAT'
                invalidToken:
                  $ref: '#/components/examples/AUTH_INVALID_TOKEN'
        '404':
          description: |
            Auth user not found.

            | Internal code | Message |
            |---------------|---------|
            | `AUTH_USER.NOT_FOUND` | 認証ユーザーが見つかりません |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                authUserNotFound:
                  $ref: '#/components/examples/AUTH_USER_NOT_FOUND'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  $ref: '#/components/examples/SYSTEM_INTERNAL_ERROR'
  /auth/users/review-preferences:
    patch:
      tags:
        - Auth Users
      summary: Update app review preferences
      description: |
        Updates the app review status for the authenticated user.
        `last_app_review_dialog_shown_at` is always updated to the current timestamp on every call, even for same-value updates.

        **Business Rules:**
        1. **Dialog timestamp always updated**: `last_app_review_dialog_shown_at` is set to the current timestamp on every call regardless of whether the status value changes (R8-AC2; see `design.md` → Assertion Rules For Test Authors).
        2. **No transition constraints**: Any status value may transition to any other status value, including reverting from COMPLETED or PERMANENTLY_DECLINED back to PENDING (R8-AC3; see `design.md` → State Model).
      operationId: updateReviewPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppReviewRequest'
            examples:
              updateToCompleted:
                summary: Mark review as completed
                value:
                  app_review_status: COMPLETED
      responses:
        '200':
          description: Review preferences updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '400':
          description: |
            Bad request.

            | Internal code | Message |
            |---------------|---------|
            | `VALIDATION.FAILED` | 入力内容に誤りがあります |
            | `REQUEST.MALFORMED_JSON` | リクエストの形式が正しくありません |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationFailed:
                  $ref: '#/components/examples/VALIDATION_FAILED'
                malformedJson:
                  $ref: '#/components/examples/REQUEST_MALFORMED_JSON'
        '401':
          description: |
            Unauthorized — invalid or missing authentication token.

            | Internal code | Message |
            |---------------|---------|
            | `AUTH.MISSING_CREDENTIALS` | 認証情報が必要です |
            | `AUTH.INVALID_FORMAT` | 認証情報の形式が正しくありません |
            | `AUTH.INVALID_TOKEN` | 認証トークンが無効です |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingCredentials:
                  $ref: '#/components/examples/AUTH_MISSING_CREDENTIALS'
                invalidFormat:
                  $ref: '#/components/examples/AUTH_INVALID_FORMAT'
                invalidToken:
                  $ref: '#/components/examples/AUTH_INVALID_TOKEN'
        '404':
          description: |
            Auth user not found.

            | Internal code | Message |
            |---------------|---------|
            | `AUTH_USER.NOT_FOUND` | 認証ユーザーが見つかりません |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                authUserNotFound:
                  $ref: '#/components/examples/AUTH_USER_NOT_FOUND'
        '415':
          description: |
