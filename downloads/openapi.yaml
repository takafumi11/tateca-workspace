  /groups/{groupId}/transactions/settlement:
    get:
      tags:
        - Transactions
      summary: Get settlement information for a group in JPY
      description: |
        Calculates optimized settlement transactions for a group.
        All obligation amounts are converted to JPY using the exchange rate recorded with each transaction.
        Rounding residuals are adjusted by applying the difference to the largest debtor.

        **Business Rules:**
        1. **JPY only**: All settlement amounts are expressed in JPY as integers (rounded half-up) (R19-AC2; see `design.md` → Assertion Rules For Test Authors).
        2. **Minimized transfers**: The settlement algorithm minimizes the number of transfers between debtors and creditors (R19-AC3).
        3. **No group existence check**: Returns an empty list for non-existent groups or groups with no members (R17-AC3; see `design.md` → Non-gate notes).
      operationId: getTransactionSettlement
      parameters:
        - $ref: '#/components/parameters/groupIdPath'
      responses:
        '200':
          description: Settlement information retrieved successfully (empty list if no transactions or all balances are zero)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSettlementResponse'
        '400':
          description: |
            Bad request — invalid UUID format for groupId.

            | Internal code | Message |
            |---------------|---------|
