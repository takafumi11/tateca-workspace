get:
  tags:
    - Transactions
  summary: Get transaction history for a group
  description: |
    Retrieves transaction history ordered by creation date (newest first).
    Returns up to the specified count (default 5).

    **Business Rules:**
    1. **No group existence check**: Returns an empty list for non-existent groups (R15-AC4; see `design.md` → Non-gate notes).
    2. **Default count**: Returns up to 5 transactions when `count` is not specified (R15-AC3).
  operationId: getTransactionHistory
  parameters:
    - $ref: "../components/parameters/groupIdPath.yaml"
    - $ref: "../components/parameters/countQuery.yaml"
  responses:
    "200":
      description: Transaction history retrieved successfully (empty list if no transactions)
      content:
        application/json:
          schema:
            $ref: "../components/schemas/responses/TransactionHistoryResponse.yaml"
    "400":
      description: |
        Bad request — invalid UUID format for groupId.

        | Internal code | Message |
        |---------------|---------|
        | `VALIDATION.FAILED` | 入力内容に誤りがあります |
      content:
        application/json:
          schema:
            $ref: "../components/schemas/errors/ErrorResponse.yaml"
          examples:
            validationFailed:
              $ref: "../components/examples/errors/VALIDATION_FAILED.yaml"
    "401":
      description: |
        Unauthorized — invalid or missing authentication token.

        | Internal code | Message |
        |---------------|---------|
        | `AUTH.MISSING_CREDENTIALS` | 認証情報が必要です |
        | `AUTH.INVALID_FORMAT` | 認証情報の形式が正しくありません |
        | `AUTH.INVALID_TOKEN` | 認証トークンが無効です |
      content:
        application/json:
          schema:
            $ref: "../components/schemas/errors/ErrorResponse.yaml"
          examples:
            missingCredentials:
              $ref: "../components/examples/errors/AUTH_MISSING_CREDENTIALS.yaml"
            invalidFormat:
              $ref: "../components/examples/errors/AUTH_INVALID_FORMAT.yaml"
            invalidToken:
              $ref: "../components/examples/errors/AUTH_INVALID_TOKEN.yaml"
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "../components/schemas/errors/ErrorResponse.yaml"
          examples:
            internalError:
              $ref: "../components/examples/errors/SYSTEM_INTERNAL_ERROR.yaml"
