delete:
  tags:
    - Groups
  summary: Remove an unjoined member from a group
  description: |
    Permanently removes an unjoined member (not linked to an auth account) from the group.
    Both the user record and the user_groups record are deleted.
    Joined members and members involved in transactions cannot be removed.

    **Business Rules:**
    1. **Unjoined members only**: Members linked to an auth account (joined) cannot be removed; they must leave voluntarily (R7-AC1; see `design.md` → Canonical Testable Flows → DELETE フロー).
    2. **No transactions**: Members involved in transactions as payer or obligee cannot be removed (R8-AC1).
    3. **Authorization**: Only authenticated members of the group may remove unjoined members (R4-AC1).
  operationId: removeMember
  parameters:
    - $ref: "../components/parameters/groupIdPath.yaml"
    - $ref: "../components/parameters/userUuidPath.yaml"
  responses:
    "204":
      description: Member removed successfully
    "400":
      description: |
        Bad request — invalid UUID format for groupId or userUuid.

        | Internal code | Message |
        |---------------|---------|
        | `VALIDATION.FAILED` | Validation failed |
      content:
        application/json:
          schema:
            $ref: "../components/schemas/errors/ErrorResponse.yaml"
          examples:
            validationFailed:
              $ref: "../components/examples/errors/VALIDATION_FAILED.yaml"
    "401":
      description: |
        Unauthorized — invalid or missing authentication token.

        | Internal code | Message |
        |---------------|---------|
        | `AUTH.MISSING_CREDENTIALS` | Authentication required |
        | `AUTH.INVALID_FORMAT` | Invalid authentication credentials |
        | `AUTH.INVALID_TOKEN` | Invalid or expired authentication token |
      content:
        application/json:
          schema:
            $ref: "../components/schemas/errors/ErrorResponse.yaml"
          examples:
            missingCredentials:
              $ref: "../components/examples/errors/AUTH_MISSING_CREDENTIALS.yaml"
            invalidFormat:
              $ref: "../components/examples/errors/AUTH_INVALID_FORMAT.yaml"
            invalidToken:
              $ref: "../components/examples/errors/AUTH_INVALID_TOKEN.yaml"
    "403":
      description: |
        Forbidden — requester is not an authenticated member of the group.

        | Internal code | Message |
        |---------------|---------|
        | `USER.NOT_GROUP_MEMBER` | Only group members can add members |
      content:
        application/json:
          schema:
            $ref: "../components/schemas/errors/ErrorResponse.yaml"
          examples:
            notGroupMember:
              $ref: "../components/examples/errors/USER_NOT_GROUP_MEMBER.yaml"
    "404":
      description: |
        Not found — group or target member does not exist.

        | Internal code | Message |
        |---------------|---------|
        | `GROUP.NOT_FOUND` | Group not found |
        | `USER.NOT_FOUND` | User not found |
      content:
        application/json:
          schema:
            $ref: "../components/schemas/errors/ErrorResponse.yaml"
          examples:
            groupNotFound:
              $ref: "../components/examples/errors/GROUP_NOT_FOUND.yaml"
            userNotFound:
              $ref: "../components/examples/errors/USER_NOT_FOUND.yaml"
    "409":
      description: |
        Conflict — member cannot be removed due to business rule violation.

        | Internal code | Message |
        |---------------|---------|
        | `MEMBER.ALREADY_JOINED` | Member is already joined and cannot be removed |
        | `MEMBER.HAS_TRANSACTIONS` | Member has transactions and cannot be removed |
      content:
        application/json:
          schema:
            $ref: "../components/schemas/errors/ErrorResponse.yaml"
          examples:
            memberAlreadyJoined:
              $ref: "../components/examples/errors/MEMBER_ALREADY_JOINED.yaml"
            memberHasTransactions:
              $ref: "../components/examples/errors/MEMBER_HAS_TRANSACTIONS.yaml"
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "../components/schemas/errors/ErrorResponse.yaml"
          examples:
            internalError:
              $ref: "../components/examples/errors/SYSTEM_INTERNAL_ERROR.yaml"
