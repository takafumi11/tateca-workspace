patch:
  tags:
    - Users
  summary: Update user name
  description: |
    Updates the display name of the authenticated user identified by userId.

    **Business Rules:**
    1. **Normalization**: Leading and trailing whitespace is trimmed before validation and persistence (R2-AC1; see `design.md` → Canonical Testable Flows → Request Flow).
    2. **Self-only update**: The authenticated user must be the owner of the target resource (R3-AC3; see `design.md` → AC Ownership Matrix).
    3. **Idempotent same-value update**: Updating with the same normalized value succeeds without modifying the resource — `updated_at` remains unchanged (R4-AC1..R4-AC3; see `design.md` → Assertion Rules For Test Authors).
  operationId: updateUserName
  parameters:
    - $ref: "../components/parameters/userIdPath.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/requests/UpdateUserNameRequest.yaml"
        examples:
          updateName:
            summary: Update display name
            value:
              user_name: "Alice"
  responses:
    "200":
      description: User name updated successfully (also returned for idempotent same-value updates)
      content:
        application/json:
          schema:
            $ref: "../components/schemas/responses/UserResponse.yaml"
    "400":
      description: |
        Bad request.

        | Internal code | Message |
        |---------------|---------|
        | `VALIDATION.FAILED` | Validation failed |
        | `REQUEST.MALFORMED_JSON` | Malformed JSON request body |
      content:
        application/json:
          schema:
            $ref: "../components/schemas/errors/ErrorResponse.yaml"
          examples:
            validationFailed:
              $ref: "../components/examples/errors/VALIDATION_FAILED.yaml"
            malformedJson:
              $ref: "../components/examples/errors/REQUEST_MALFORMED_JSON.yaml"
    "401":
      description: |
        Unauthorized — invalid or missing authentication token.

        | Internal code | Message |
        |---------------|---------|
        | `AUTH.MISSING_CREDENTIALS` | Missing authentication credentials |
        | `AUTH.INVALID_FORMAT` | Invalid authentication format |
        | `AUTH.INVALID_TOKEN` | Invalid or expired authentication token |
      content:
        application/json:
          schema:
            $ref: "../components/schemas/errors/ErrorResponse.yaml"
          examples:
            missingCredentials:
              $ref: "../components/examples/errors/AUTH_MISSING_CREDENTIALS.yaml"
            invalidFormat:
              $ref: "../components/examples/errors/AUTH_INVALID_FORMAT.yaml"
            invalidToken:
              $ref: "../components/examples/errors/AUTH_INVALID_TOKEN.yaml"
    "403":
      description: |
        Forbidden — authenticated user is not the owner of the target resource.

        | Internal code | Message |
        |---------------|---------|
        | `USER.FORBIDDEN` | You are not allowed to modify this resource |
      content:
        application/json:
          schema:
            $ref: "../components/schemas/errors/ErrorResponse.yaml"
          examples:
            userForbidden:
              $ref: "../components/examples/errors/USER_FORBIDDEN.yaml"
    "404":
      description: |
        User not found.

        | Internal code | Message |
        |---------------|---------|
        | `USER.NOT_FOUND` | User not found |
      content:
        application/json:
          schema:
            $ref: "../components/schemas/errors/ErrorResponse.yaml"
          examples:
            userNotFound:
              $ref: "../components/examples/errors/USER_NOT_FOUND.yaml"
    "415":
      description: |
        Unsupported Media Type — Content-Type must be application/json.

        | Internal code | Message |
        |---------------|---------|
        | `REQUEST.UNSUPPORTED_MEDIA_TYPE` | Unsupported media type |
      content:
        application/json:
          schema:
            $ref: "../components/schemas/errors/ErrorResponse.yaml"
          examples:
            unsupportedMediaType:
              $ref: "../components/examples/errors/REQUEST_UNSUPPORTED_MEDIA_TYPE.yaml"
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "../components/schemas/errors/ErrorResponse.yaml"
          examples:
            internalError:
              $ref: "../components/examples/errors/SYSTEM_INTERNAL_ERROR.yaml"
